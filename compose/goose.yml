name: ai-workstation-goose

services:
  goose:
    image: "${GOOSE_IMAGE:-ghcr.io/aaif-goose/goose:v1.44.0}"
    environment:
      HOME: /home/goose
      GOOSE_PROVIDER: "${GOOSE_PROVIDER:-openrouter}"
      GOOSE_MODEL: "${GOOSE_MODEL:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      GOOSE_DISABLE_KEYRING: "${GOOSE_DISABLE_KEYRING:-1}"
      GOOSE_DISABLE_TELEMETRY: "${GOOSE_DISABLE_TELEMETRY:-1}"
    volumes:
      - type: volume
        source: goose-home
        target: /home/goose
    init: true
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  goose-home:
    name: ai-workstation_goose-home
