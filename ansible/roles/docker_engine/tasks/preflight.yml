---
- name: Verify Docker host prerequisites
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == versions.ubuntu.release
      - ansible_facts.service_mgr == "systemd"
      - ansible_facts.architecture in docker_architecture_map
    quiet: true

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Determine installed conflicting packages
  ansible.builtin.set_fact:
    docker_installed_conflicts: >-
      {{
        docker_conflicting_packages
        | select('in', ansible_facts.packages)
        | list
      }}

- name: Refuse destructive conflict removal
  ansible.builtin.assert:
    that:
      - docker_installed_conflicts | length == 0
    fail_msg: >-
      Conflicting packages are installed:
      {{ docker_installed_conflicts | join(', ') }}.
      They are not removed automatically.
    quiet: true
