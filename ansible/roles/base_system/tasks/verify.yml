---
- name: Verify supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == versions.ubuntu.release
      - ansible_facts.service_mgr == "systemd"
    quiet: true

- name: Read required executable metadata
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/curl
    - /usr/bin/git
    - /usr/bin/python3
  register: base_executable_stats

- name: Verify required executables
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.executable
    quiet: true
  loop: "{{ base_executable_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
