---
- name: Verify supported host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_version == versions.ubuntu.release
      - ansible_facts.service_mgr == "systemd"
    fail_msg: >-
      AI Workstation supports Ubuntu {{ versions.ubuntu.release }} with systemd.
    quiet: true

- name: Install base operating-system packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - python3
      - python3-apt
      - python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600
