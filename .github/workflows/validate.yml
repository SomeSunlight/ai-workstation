name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
      - name: Synchronize locked environment
        run: uv sync --frozen
      - name: Verify repository files
        run: |
          test -f uv.lock
          bash -n install.sh bootstrap/linux/install.sh bin/aiw bin/aiw-core runtimes/local-inference/manage.sh runtimes/local-inference/service.sh tools/*.sh tests/smoke/*.sh
          python -m json.tool config/versions.json >/dev/null
          python tools/check-version-consistency.py
          bash tools/release-check.sh
          bash tests/smoke/repository-layout.sh
          bash tests/smoke/local-inference-runtime.sh
          bash tests/smoke/local-inference-service.sh
          bash tests/smoke/goose-runtime.sh
          bash tests/smoke/open-webui-runtime.sh
          bash tests/smoke/interactive-menu.sh
          uv run --frozen python tests/smoke/services-registry.py

      - name: Verify actual pinned native Process Compose (disposable Ubuntu project)
        run: |
          export AIW_SERVICES_DIR="$(mktemp -d)"
          uv run --frozen python tools/aiw-services.py init
          uv run --frozen python tools/aiw-services.py install
          uv run --frozen python tools/aiw-services.py check
          if command -v go >/dev/null 2>&1; then
            go version -m "$AIW_SERVICES_DIR/bin/process-compose"
          fi
      - name: Install Ansible collection
        run: |
          mkdir -p .ansible/collections
          ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" \
            uv run --frozen ansible-galaxy collection install \
              --requirements-file ansible/requirements.yml \
              --collections-path .ansible/collections
      - name: Lint Ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_INVENTORY: ${{ github.workspace }}/ansible/inventory/localhost.yml
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: uv run --frozen ansible-lint --config-file ansible/.ansible-lint ansible/playbooks
      - name: Check playbook syntax
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_INVENTORY: ${{ github.workspace }}/ansible/inventory/localhost.yml
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: |
          uv run --frozen ansible-playbook ansible/playbooks/workstation.yml --syntax-check
          uv run --frozen ansible-playbook ansible/playbooks/verify.yml --syntax-check

  windows-shortcuts:
    runs-on: windows-2025
    steps:
      # ContextCanon snapshots include paths exceeding Windows' legacy MAX_PATH.
      # This smoke test needs only these two source folders.
      - name: Check out Windows code and tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            bootstrap/windows
            tests/windows
            tools/aiw-secret-windows.ps1
            tools/aiw-services.py
            config/versions.json
      - name: Verify Windows shortcut creation and safe rename migration
        shell: pwsh
        run: ./tests/windows/shortcuts.ps1
      - name: Parse native Windows Process Compose and DPAPI helper
        shell: pwsh
        run: |
          foreach ($path in @('bootstrap/windows/Services.ps1', 'tools/aiw-secret-windows.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Install pinned uv for Windows native client test
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
      - name: Exercise the real native Windows menu under StrictMode
        shell: pwsh
        run: ./tests/windows/services-menu.ps1
      - name: Real Windows DPAPI and named-client registration (temporary only)
        shell: pwsh
        run: |
          $env:AIW_SERVICES_DIR = Join-Path $env:RUNNER_TEMP "aiw-test-services"
          & ./bootstrap/windows/Services.ps1 init
          & ./bootstrap/windows/Services.ps1 client add goose-laptop --policy passthrough
          & ./bootstrap/windows/Services.ps1 client add webui-laptop --policy default
          & ./bootstrap/windows/Services.ps1 client render
          $clients = Get-Content "$env:AIW_SERVICES_DIR/clients.json" -Raw | ConvertFrom-Json
          if ($clients.clients.Count -ne 2) { throw 'Expected 2 identities.' }
          if ($clients.clients[0].id -ne 'goose-laptop' -or $clients.clients[1].id -ne 'webui-laptop') {
            throw 'Wrong S02 identity name/order.'
          }
          $dpapi = "$env:AIW_SERVICES_DIR/secrets/goose-laptop.dpapi"
          if (-not (Test-Path $dpapi) -or (Get-Item $dpapi).Length -lt 50) {
            throw 'Missing protected Windows DPAPI client credential.'
          }
          # "client render" already decrypted the DPAPI value and hashed it.
          # Never recover or print a plaintext test token in GitHub Actions logs.
          if ($clients.clients[0].token_sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Invalid S02 token digest.'
          }
          # Revoke the temporary original ID first: S02 MUST reject
          # duplicate credential digests under different client names.
          & ./bootstrap/windows/Services.ps1 client remove goose-laptop
          & ./bootstrap/windows/Services.ps1 client import-dpapi home-gateway --from-file $dpapi --policy passthrough
          & ./bootstrap/windows/Services.ps1 client render
          $remaining = Get-Content "$env:AIW_SERVICES_DIR/clients.json" -Raw | ConvertFrom-Json
          if ($remaining.clients.Count -ne 2 -or
              $remaining.clients[0].id -ne 'webui-laptop' -or
              $remaining.clients[1].id -ne 'home-gateway') {
            throw 'Revocation or DPAPI transitional identity import failed.'
          }
          # Real checked native Windows executable + config validation, no services started.
          & ./bootstrap/windows/Services.ps1 install
          & ./bootstrap/windows/Services.ps1 check
