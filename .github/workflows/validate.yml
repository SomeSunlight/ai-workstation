name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
      - name: Synchronize locked environment
        run: uv sync --frozen
      # Check the committed Official Context packages without regenerating them.
      # Pin CLI 0.10.0 (internal compiler 0.8.0) to the exact verified source revision;
      # do not silently import newer ContextCanon or Development Workflow semantics.
      - name: Verify ContextCanon generated packages (read-only)
        run: |
          uvx --from "git+https://github.com/SomeSunlight/context-canon.git@786c50957c4c06f9209ebacfa021609b592c0b07" contextcanon --version
          uvx --from "git+https://github.com/SomeSunlight/context-canon.git@786c50957c4c06f9209ebacfa021609b592c0b07" contextcanon check --all .

      - name: Verify repository files
        run: |
          test -f uv.lock
          bash -n install.sh bootstrap/linux/install.sh bin/aiw bin/aiw-core bin/aiw-nemo runtimes/local-inference/manage.sh runtimes/local-inference/service.sh tools/*.sh tests/smoke/*.sh
          python -m json.tool config/versions.json >/dev/null
          python tools/check-version-consistency.py
          bash tools/release-check.sh
          bash tests/smoke/repository-layout.sh
          bash tests/smoke/local-inference-runtime.sh
          bash tests/smoke/local-inference-service.sh
          bash tests/smoke/goose-runtime.sh
          python tests/smoke/agent-sandbox.py
          python -B tests/smoke/openshell-preflight.py
          python -B tests/smoke/nemoclaw-profile.py
          bash tests/smoke/open-webui-runtime.sh
          bash tests/smoke/interactive-menu.sh
          uv run --frozen python tests/smoke/services-registry.py
          uv run --frozen python tests/smoke/native-operation-diagnostics.py

      - name: Verify actual pinned native Process Compose (disposable Ubuntu project)
        run: |
          export AIW_SERVICES_DIR="$(mktemp -d)"
          uv run --frozen python tools/aiw-services.py init
          uv run --frozen python tools/aiw-services.py install
          uv run --frozen python tools/aiw-services.py check
          # Prove native UNIX detached lifecycle, rather than just mocked args.
          sed -i 's/disabled: true/disabled: false/' "$AIW_SERVICES_DIR/process-compose.yaml"
          trap 'uv run --frozen python tools/aiw-services.py down || true' EXIT
          uv run --frozen python tools/aiw-services.py up
          uv run --frozen python tools/aiw-services.py status
          uv run --frozen python tools/aiw-services.py logs
          uv run --frozen python tools/aiw-services.py down
          trap - EXIT
          if command -v go >/dev/null 2>&1; then
            go version -m "$AIW_SERVICES_DIR/bin/process-compose"
          fi
      - name: Install Ansible collection
        run: |
          mkdir -p .ansible/collections
          ANSIBLE_CONFIG="$PWD/ansible/ansible.cfg" \
            uv run --frozen ansible-galaxy collection install \
              --requirements-file ansible/requirements.yml \
              --collections-path .ansible/collections
      - name: Lint Ansible
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_INVENTORY: ${{ github.workspace }}/ansible/inventory/localhost.yml
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: uv run --frozen ansible-lint --config-file ansible/.ansible-lint ansible/playbooks
      - name: Check playbook syntax
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
          ANSIBLE_INVENTORY: ${{ github.workspace }}/ansible/inventory/localhost.yml
          ANSIBLE_ROLES_PATH: ${{ github.workspace }}/ansible/roles
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/.ansible/collections
        run: |
          uv run --frozen ansible-playbook ansible/playbooks/workstation.yml --syntax-check
          uv run --frozen ansible-playbook ansible/playbooks/verify.yml --syntax-check
          uv run --frozen ansible-playbook ansible/playbooks/nemoclaw.yml --syntax-check
          uv run --frozen ansible-playbook ansible/playbooks/nemoclaw-verify.yml --syntax-check

  sandbox-docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify actual disposable Docker home and approved image inheritance
        run: |
          docker info >/dev/null
          bash tests/smoke/agent-sandbox-docker.sh

  windows-shortcuts:
    runs-on: windows-2025
    steps:
      # ContextCanon snapshots include paths exceeding Windows' legacy MAX_PATH.
      # This smoke test needs only these two source folders.
      - name: Check out Windows code and tests
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            bootstrap/windows
            install-nemoclaw.ps1
            aiw.cmd
            tests/windows
            tools/aiw-secret-windows.ps1
            tools/aiw-download-windows.ps1
            tools/aiw-services.py
            tools/aiw-native-host.py
            tests/smoke/native-operation-diagnostics.py
            tools/aiw-native-child.ps1
            tools/aiw-native-health.ps1
            tools/aiw-native-integrity.ps1
            config/versions.json
            tools/agent_sandbox.py
            tools/agent_sandbox_core.py
            tests/smoke/agent-sandbox.py
      - name: Verify cross-platform sandbox recipe/path handling (no Docker daemon)
        shell: pwsh
        run: python tests/smoke/agent-sandbox.py
      - name: Verify Windows shortcut creation and safe rename migration
        shell: pwsh
        run: ./tests/windows/shortcuts.ps1
      - name: Verify Windows installer staging cleanup under transient locks
        shell: pwsh
        run: ./tests/windows/staging-cleanup.ps1
      - name: Verify separate NemoClaw penguin and installer profile (offline)
        shell: pwsh
        run: ./tests/windows/nemoclaw-profile.ps1
      - name: Parse native Windows Process Compose and DPAPI helper
        shell: pwsh
        run: |
          foreach ($path in @('bootstrap/windows/Launch-NemoClaw.ps1', 'bootstrap/windows/Create-NemoClawShortcut.ps1', 'bootstrap/windows/Install-AiWorkstation.ps1', 'install-nemoclaw.ps1', 'tests/windows/nemoclaw-profile.ps1', 'bootstrap/windows/Services.ps1', 'tools/aiw-secret-windows.ps1', 'tools/aiw-download-windows.ps1', 'tools/aiw-native-child.ps1', 'tools/aiw-native-health.ps1', 'tools/aiw-native-integrity.ps1', 'tests/windows/native-integrity.ps1', 'bootstrap/windows/Register-AiwCommand.ps1', 'tests/windows/native-host.ps1', 'tests/windows/native-aiw-command.ps1', 'tests/windows/s02-three-clients.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
              exit 1
            }
          }
      - name: Install pinned uv for Windows native client test
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.26"
      - name: Exercise offline native host diagnostic regressions on Windows
        shell: pwsh
        run: uv run --no-project --with PyYAML==6.0.3 python tests/smoke/native-operation-diagnostics.py
      - name: Exercise the real native Windows menu under StrictMode
        shell: pwsh
        run: ./tests/windows/services-menu.ps1
      - name: Verify short native Windows aiw command and optional user registration
        shell: pwsh
        run: ./tests/windows/native-aiw-command.ps1
      - name: Validate three individual DPAPI client keys and transitional legacy digest
        shell: pwsh
        run: ./tests/windows/s02-three-clients.ps1
      - name: Test explicit offline Strata hash approval, denial and rollback
        shell: pwsh
        run: ./tests/windows/native-integrity.ps1
      - name: Validate private four-service Windows host setup (no processes started)
        shell: pwsh
        run: ./tests/windows/native-host.ps1
      - name: Real Windows DPAPI and named-client registration (temporary only)
        shell: pwsh
        run: |
          $env:AIW_SERVICES_DIR = Join-Path $env:RUNNER_TEMP "aiw-test-services"
          & ./bootstrap/windows/Services.ps1 init
          & ./bootstrap/windows/Services.ps1 client add goose-laptop --policy passthrough
          & ./bootstrap/windows/Services.ps1 client add webui-laptop --policy default
          & ./bootstrap/windows/Services.ps1 client render
          $clients = Get-Content "$env:AIW_SERVICES_DIR/clients.json" -Raw | ConvertFrom-Json
          if ($clients.clients.Count -ne 2) { throw 'Expected 2 identities.' }
          if ($clients.clients[0].id -ne 'goose-laptop' -or $clients.clients[1].id -ne 'webui-laptop') {
            throw 'Wrong S02 identity name/order.'
          }
          $dpapi = "$env:AIW_SERVICES_DIR/secrets/goose-laptop.dpapi"
          if (-not (Test-Path $dpapi) -or (Get-Item $dpapi).Length -lt 50) {
            throw 'Missing protected Windows DPAPI client credential.'
          }
          # "client render" already decrypted the DPAPI value and hashed it.
          # Never recover or print a plaintext test token in GitHub Actions logs.
          if ($clients.clients[0].token_sha256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Invalid S02 token digest.'
          }
          # Revoke the temporary original ID first: S02 MUST reject
          # duplicate credential digests under different client names.
          & ./bootstrap/windows/Services.ps1 client remove goose-laptop
          & ./bootstrap/windows/Services.ps1 client import-dpapi home-gateway --from-file $dpapi --policy passthrough
          & ./bootstrap/windows/Services.ps1 client render
          $remaining = Get-Content "$env:AIW_SERVICES_DIR/clients.json" -Raw | ConvertFrom-Json
          if ($remaining.clients.Count -ne 2 -or
              $remaining.clients[0].id -ne 'webui-laptop' -or
              $remaining.clients[1].id -ne 'home-gateway') {
            throw 'Revocation or DPAPI transitional identity import failed.'
          }
          # Real checked native Windows executable + config validation, no services started.
          & ./bootstrap/windows/Services.ps1 install
          & ./bootstrap/windows/Services.ps1 check
          # Real native Windows lifecycle: Windows upstream deliberately has
          # NO --detached; AIW bootstraps its own headless supervisor process.
          $fixture = "$env:AIW_SERVICES_DIR/process-compose.yaml"
          (Get-Content $fixture -Raw).Replace('disabled: true', 'disabled: false') |
            Set-Content -LiteralPath $fixture
          try {
            & ./bootstrap/windows/Services.ps1 up
            $ownerRecord = "$env:AIW_SERVICES_DIR/runtime/process-compose-windows.json"
            if (-not (Test-Path $ownerRecord)) {
              throw 'Windows supervisor identity/PID marker missing.'
            }
            $firstRecord = Get-Content -LiteralPath $ownerRecord -Raw
            $firstId = ($firstRecord | ConvertFrom-Json).identity
            & ./bootstrap/windows/Services.ps1 up
            $secondId = (Get-Content -LiteralPath $ownerRecord -Raw | ConvertFrom-Json).identity
            if ($firstId.pid -ne $secondId.pid -or $firstId.created -ne $secondId.created) {
              throw 'Idempotent Start created another supervisor instead of reusing the owner.'
            }
            & ./bootstrap/windows/Services.ps1 status
            & ./bootstrap/windows/Services.ps1 logs
          }
          finally {
            & ./bootstrap/windows/Services.ps1 down
          }
          if (Test-Path "$env:AIW_SERVICES_DIR/runtime/process-compose-windows.json") {
            throw 'Supervisor ownership record not removed on down.'
          }
          # Simulate a prior unclean Windows exit using the already-stopped
          # supervisor's record; never interfere with a live process.
          Set-Content -LiteralPath $ownerRecord -Value $firstRecord -NoNewline -Encoding utf8
          try {
            & ./bootstrap/windows/Services.ps1 up
            if (-not (Test-Path -LiteralPath $ownerRecord)) {
              throw 'Stale ownership was not recovered on the next start.'
            }
            if (@(Get-ChildItem -LiteralPath "$env:AIW_SERVICES_DIR/runtime" -Filter '*.stale-*.bak').Count -ne 1) {
              throw 'Expected exactly one archived stale ownership record.'
            }
          }
          finally { & ./bootstrap/windows/Services.ps1 down }
          & ./bootstrap/windows/Services.ps1 down  # idempotent, no foreign control
          # Exercise real native Windows HTTPS fallback and verified offline
          # archive import in a distinct temporary workspace.
          $offline = Join-Path $env:RUNNER_TEMP "process-compose_windows_amd64.zip"
          & ./tools/aiw-download-windows.ps1 -Uri "https://github.com/F1bonacc1/process-compose/releases/download/v1.124.0/process-compose_windows_amd64.zip" -Destination $offline
          $env:AIW_SERVICES_DIR = Join-Path $env:RUNNER_TEMP "aiw-offline-import-test"
          & ./bootstrap/windows/Services.ps1 init
          & ./bootstrap/windows/Services.ps1 install --archive $offline
          & ./bootstrap/windows/Services.ps1 check
          Remove-Item -LiteralPath $offline -Force
