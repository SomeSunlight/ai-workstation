name: ContextCanon Issue 1 finalizer

on:
  push:
    branches:
      - agent/explicit-context-node-names

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Run ContextCanon Issue 1 migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/contextcanon_issue1_finalize.py
