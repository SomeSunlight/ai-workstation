name: Reconcile PR 2 baseline

on:
  push:
    branches:
      - agent/post-merge-pr2-baseline

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/post-merge-pr2-baseline
          fetch-depth: 0
      - name: Wait for explicit trigger
        id: trigger
        shell: bash
        run: |
          if [[ -f .post-merge-pr2-baseline-trigger ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply bounded documentation reconciliation
        if: steps.trigger.outputs.run == 'true'
        run: python .github/scripts/reconcile_pr2_baseline.py
      - name: Verify repository hygiene
        if: steps.trigger.outputs.run == 'true'
        shell: bash
        run: |
          git diff --check
          bash -n bin/aiw
      - name: Commit clean reconciliation
        if: steps.trigger.outputs.run == 'true'
        shell: bash
        run: |
          rm .github/scripts/reconcile_pr2_baseline.py
          rm .github/workflows/post-merge-pr2-baseline.yml
          rm .post-merge-pr2-baseline-trigger
          git config user.name "ContextCanon automation"
          git config user.email "actions@users.noreply.github.com"
          git add PLAN.md STATE.md .github .post-merge-pr2-baseline-trigger
          git commit -m "Reconcile accepted baseline after PR #2 merge (#3)"
          git push origin HEAD:agent/post-merge-pr2-baseline
